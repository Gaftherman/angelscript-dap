name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "project(angelscript_dap VERSION ${version} " CMakeLists.txt || { echo "::error::CMakeLists.txt does not declare version ${version}."; exit 1; }
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [${version}]" 'index($0, h) == 1 {on=1; next} substr($0,1,3) == "## " || substr($0,1,1) == "[" {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${version}."; exit 1; }
      - name: Build a clean source zip
        run: |
          name="angelscript-dap-${GITHUB_REF_NAME}"
          mkdir dist
          git archive --format=zip --prefix="${name}/" -o "dist/${name}.zip" HEAD
          if unzip -l "dist/${name}.zip" | grep -E '\.(gif|png|mp4|log)$|scripts/demos|\.github'; then echo "::error::The zip holds media or demo files."; exit 1; fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
